<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Parcel Hub email parsing</title>
  <desc id="desc">An Outlook-like message and Parcel Hub panel showing a parsed shipping request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9FAFB"/>
      <stop offset="1" stop-color="#EDF3F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102934" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect x="62" y="54" width="1160" height="692" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="62" y="54" width="1160" height="58" rx="18" fill="#24536B"/>
  <rect x="62" y="92" width="1160" height="20" fill="#24536B"/>
  <text x="94" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Outlook</text>
  <rect x="94" y="140" width="282" height="566" rx="12" fill="#F3F7F8" stroke="#D9E4E7"/>
  <rect x="116" y="168" width="238" height="66" rx="9" fill="#FFFFFF" stroke="#D9E4E7"/>
  <text x="132" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Shipment request</text>
  <text x="132" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6C73">Today 8:42 AM</text>
  <rect x="116" y="252" width="238" height="66" rx="9" fill="#EAF4F5" stroke="#BFD7DA"/>
  <text x="132" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Return waybill</text>
  <text x="132" y="303" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6C73">Clinical site pickup</text>
  <rect x="116" y="336" width="238" height="66" rx="9" fill="#FFFFFF" stroke="#D9E4E7"/>
  <text x="132" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Customs follow-up</text>
  <text x="132" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6C73">Yesterday 4:11 PM</text>
  <rect x="410" y="140" width="512" height="566" rx="12" fill="#FFFFFF" stroke="#D9E4E7"/>
  <text x="442" y="184" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17384B">Return waybill request</text>
  <text x="442" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A6B72">From: site-coordinator@example.com</text>
  <line x1="442" y1="244" x2="888" y2="244" stroke="#D9E4E7"/>
  <text x="442" y="286" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243C47">Please create a return waybill for the two devices below.</text>
  <text x="442" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#51666F">Pickup: Milano Clinical Site</text>
  <text x="442" y="356" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#51666F">Destination: Ohio depot</text>
  <text x="442" y="386" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#51666F">Carrier preference: FedEx International Priority</text>
  <rect x="442" y="430" width="414" height="104" rx="10" fill="#F7FAFB" stroke="#D9E4E7"/>
  <text x="466" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Device and package details</text>
  <text x="466" y="492" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6B72">2 TrialSlate kits, 1 battery label, 5.4 kg total</text>
  <text x="466" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6B72">Reference: RAWB-10472</text>
  <rect x="960" y="140" width="250" height="566" rx="18" fill="#F9FBFC" stroke="#CAD7DA"/>
  <rect x="960" y="140" width="250" height="66" rx="18" fill="#17384B"/>
  <text x="990" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Parcel Hub</text>
  <text x="990" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#42606A">Parsed email</text>
  <rect x="990" y="260" width="190" height="34" rx="17" fill="#E3F3EC"/>
  <text x="1085" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#17613E">Ready to review</text>
  <text x="990" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17384B">Ticket</text>
  <text x="990" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">RAWB-10472</text>
  <text x="990" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17384B">Route</text>
  <text x="990" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">Italy to United States</text>
  <text x="990" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17384B">Attachments</text>
  <text x="990" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">Instructions and battery label</text>
  <rect x="990" y="578" width="180" height="50" rx="10" fill="#1F5F64"/>
  <text x="1080" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Create ticket</text>
</svg>
