<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Parcel Hub return routing queue</title>
  <desc id="desc">A Parcel Hub queue view showing carrier routing, writeback states, and tracking preservation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F9FA"/>
      <stop offset="1" stop-color="#E8F0F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102934" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect x="78" y="56" width="1124" height="688" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
