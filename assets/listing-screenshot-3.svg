  <text x="1104" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#234958">Details</text>
  <rect x="118" y="554" width="494" height="108" rx="14" fill="#FDFBF4" stroke="#E9D79B"/>
