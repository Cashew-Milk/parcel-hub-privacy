<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Parcel Hub shipment review</title>
  <desc id="desc">A browser window showing a Parcel Hub side panel reviewing shipment data and carrier handoff state.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFB"/>
      <stop offset="1" stop-color="#E6EEF0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#09202D" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#page-bg)"/>
  <rect x="70" y="58" width="1140" height="684" rx="18" fill="#FFFFFF" filter="url(#soft-shadow)"/>
  <rect x="70" y="58" width="1140" height="58" rx="18" fill="#15344D"/>
  <rect x="70" y="96" width="1140" height="20" fill="#15344D"/>
  <circle cx="104" cy="87" r="7" fill="#F36B5F"/>
  <circle cx="128" cy="87" r="7" fill="#F0C15A"/>
  <circle cx="152" cy="87" r="7" fill="#51B56D"/>
  <rect x="210" y="76" width="505" height="18" rx="9" fill="#EAF4F5" opacity="0.22"/>
  <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#163241">NetSuite return ticket</text>
  <rect x="90" y="176" width="748" height="104" rx="10" fill="#F3F7F8" stroke="#D7E2E5"/>
  <text x="116" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17384B">Return Air Waybill RAWB-10472</text>
  <text x="116" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#48636D">Berlin clinical site to Ohio depot, 2 cartons, customs review required</text>
  <rect x="90" y="314" width="360" height="192" rx="10" fill="#FFFFFF" stroke="#D7E2E5"/>
  <text x="116" y="354" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17384B">Recipient</text>
  <text x="116" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#213B48">Parcel Hub Depot</text>
  <text x="116" y="422" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52656D">Cincinnati, OH 45202</text>
  <text x="116" y="454" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52656D">US importer and EORI captured</text>
  <rect x="478" y="314" width="360" height="192" rx="10" fill="#FFFFFF" stroke="#D7E2E5"/>
  <text x="504" y="354" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17384B">Packages</text>
  <text x="504" y="390" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#213B48">2 cartons, 7.6 kg total</text>
  <text x="504" y="422" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52656D">Lithium battery attachment included</text>
  <text x="504" y="454" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52656D">Commercial value and HS fields ready</text>
  <rect x="90" y="546" width="748" height="134" rx="10" fill="#FDFBF4" stroke="#E9D79B"/>
  <circle cx="126" cy="589" r="12" fill="#F0C15A"/>
  <text x="151" y="596" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#183242">Carrier route selected</text>
  <text x="151" y="630" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6470">Parcel Hub keeps the ticket, queue, label result, and tracking writeback in one flow.</text>
  <rect x="880" y="138" width="310" height="572" rx="18" fill="#F9FBFC" stroke="#CAD7DA"/>
  <rect x="880" y="138" width="310" height="66" rx="18" fill="#17384B"/>
  <text x="910" y="181" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Parcel Hub</text>
  <text x="910" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#42606A">Shipment review</text>
  <rect x="910" y="256" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#DCE7EA"/>
  <text x="932" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Destination</text>
  <text x="932" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">Cincinnati depot, United States</text>
  <rect x="910" y="352" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#DCE7EA"/>
  <text x="932" y="384" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Return routing</text>
  <text x="932" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">FedEx return workflow ready</text>
  <rect x="910" y="448" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#DCE7EA"/>
  <text x="932" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17384B">Writeback state</text>
  <text x="932" y="506" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5C6E75">No duplicate active job found</text>
  <rect x="910" y="560" width="250" height="52" rx="10" fill="#1F5F64"/>
  <text x="1035" y="593" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Quick Ship</text>
  <rect x="910" y="628" width="250" height="42" rx="10" fill="#FFFFFF" stroke="#B8CDD1"/>
  <text x="1035" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#234958">Review fields</text>
</svg>
